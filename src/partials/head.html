<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{t.docTitle}}</title>
<meta name="description" content="{{t.description}}">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<meta name="theme-color" content="#FFFBF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16141E" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF5A3C'/%3E%3Cpath d='M10.5 22.5v-13l11 13v-13' fill='none' stroke='%231C1B29' stroke-width='3.6' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
  /* TEMA — kayıtlı tercih CSS'ten önce uygulanır ki açılışta renk yanıp sönmesin.
     Tercih yalnızca bu cihazda (localStorage) durur, hiçbir yere gönderilmez. */
  try{var t=localStorage.getItem("noupload-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}
</script>
<style>[hidden]{display:none !important}</style><!-- site.css yüklenemese bile gizli bölümler gizli kalsın -->
<link rel="stylesheet" href="{{root}}assets/site.css">
