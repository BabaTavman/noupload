<!doctype html>
<html lang="{{lang}}">
<head>
<meta name="robots" content="noindex"><!-- build:remove — bu satır yalnızca şablonda durur (src/ dizine eklenmesin); üretilen sayfaya girmez -->
{{> head}}
<style>
  /* Bu sayfaya özgü stil. Ortak kurallar (renkler, üst çubuk, düğmeler, kartlar) assets/site.css'te;
     bu blok ondan sonra geldiği için aynı seçicide buradaki geçerli olur. */
  :root{--radius:12px}
  /* iki dilde ana sayfanın çubuğu bol bol sığıyor, düğme eski hâlindeki gibi yazısı kadar; dil sayısı artınca
     site.css'teki sabit genişlik devreye girer ki tema yazısı değişince çubuk oynamasın */
  .bar[data-langs="2"] #theme{min-width:0}
  .bar[data-langs="2"] .barbtns{flex-wrap:nowrap}
  body{
    background:
      radial-gradient(900px 420px at 85% -10%, var(--accent-soft) 0%, transparent 60%),
      radial-gradient(var(--dot) 1px, transparent 1px) 0 0/22px 22px,
      var(--ground);
    padding:22px 20px 64px;
  }
  .wrap{gap:56px}

  /* grid çocukları içeriğinden geniş olmasın (SVG'nin viewBox genişliği sayfayı taşırmasın) */
  .hero > *, .compare > *, .tools > *{min-width:0}
  svg{max-width:100%}

  /* ---------- üst çubuk ---------- */
  .bar{flex-wrap:nowrap;margin-bottom:0}
  .brand .mark{width:30px;height:30px;border-radius:8px}
  .brand .mark svg{width:18px;height:18px}
  .brand span{font-size:1.15rem}
  .langbtn{padding:7px 12px;font-size:.82rem;background:var(--surface);border-radius:8px}
  .langbtn:hover{border-color:var(--accent)}

  /* ---------- giriş: iki sütun ---------- */
  .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
  @media (max-width:820px){.hero{grid-template-columns:1fr;gap:28px}}
  .hero h1{margin:0 0 14px;font-size:clamp(2rem,1.2rem + 2.6vw,3.1rem);letter-spacing:-.03em;line-height:1.08;text-wrap:balance}
  .hero p{margin:0;color:var(--ink-2);font-size:1.08rem;max-width:52ch}
  .proof{margin-top:18px;display:flex;gap:9px;align-items:flex-start;font-size:.92rem;color:var(--good);max-width:52ch}
  .proof .dotm{flex:none;width:8px;height:8px;border-radius:50%;background:var(--good);margin-top:.5em}
  .diagram{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:22px 22px 16px}
  .diagram svg{width:100%;height:auto;display:block}
  .diagram figcaption{font-family:var(--mono);font-size:.74rem;color:var(--ink-3);margin-top:10px;letter-spacing:.03em}
  .section-head h2{font-size:1.25rem}
  .section-head span{font-family:var(--mono);font-size:.76rem;color:var(--ink-3)}
  .tools{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}

  /* ---------- karşılaştırma ---------- */
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:720px){.compare{grid-template-columns:1fr}}
  .side{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:14px}
  .side.here{border-color:var(--accent)}
  .side h3{margin:0;font-size:1rem;display:flex;align-items:center;gap:9px}
  .side h3 .pill{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px}
  .pill.them{background:var(--surface-2);color:var(--ink-3)}
  .pill.us{background:var(--accent-soft);color:var(--accent)}
  .side svg{width:100%;height:auto;display:block}
  .side p{margin:0;font-size:.93rem;color:var(--ink-2)}

  /* ---------- alt ---------- */
  footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;text-align:left;border-top:1px solid var(--rule);padding-top:18px}
  footer a{color:var(--ink-3)}
</style>
</head>
<body>
<div class="wrap">

{{> bar-home}}

  <section class="hero">
    <div>
      <h1>{{t.h}}</h1>
      <p>{{t.sub}}</p>
      <div class="proof"><span class="dotm"></span><span>{{t.proof}}</span></div>
    </div>

    <figure class="diagram" style="margin:0">
      <svg viewBox="0 0 420 250" role="img" aria-labelledby="dg-title">
        <title id="dg-title">{{t.dgTitle}}</title>
        <!-- cihaz -->
        <rect x="18" y="38" width="250" height="168" rx="12" fill="var(--surface-2)" stroke="var(--rule)" stroke-width="1.5"/>
        <rect x="100" y="206" width="86" height="8" rx="3" fill="var(--rule)"/>
        <text x="30" y="60" font-family="var(--mono)" font-size="10.5" fill="var(--ink-3)" letter-spacing=".08em">{{t.dgDevice}}</text>
        <!-- giriş dosyası -->
        <g transform="translate(42,88)">
          <path d="M0 0h30l14 14v48H0z" fill="var(--surface)" stroke="var(--ink-2)" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M30 0v14h14" fill="none" stroke="var(--ink-2)" stroke-width="1.6"/>
          <path d="M9 30h26M9 40h26M9 50h18" stroke="var(--ink-3)" stroke-width="1.6" stroke-linecap="round"/>
        </g>
        <!-- ok -->
        <path d="M96 119h28" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
        <path d="M120 114l6 5-6 5" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- işlem (tarayıcı) -->
        <g transform="translate(132,92)">
          <rect x="0" y="0" width="60" height="54" rx="8" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6"/>
          <circle cx="30" cy="27" r="11" fill="none" stroke="var(--accent)" stroke-width="2"/>
          <path d="M30 12v6M30 36v6M15 27h6M39 27h6M19.4 16.4l4.2 4.2M36.4 33.4l4.2 4.2M19.4 37.6l4.2-4.2M36.4 20.6l4.2-4.2" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
        </g>
        <text x="162" y="164" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--accent)">{{t.dgBrowser}}</text>
        <!-- ok -->
        <path d="M198 119h28" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
        <path d="M222 114l6 5-6 5" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- çıkış dosyası -->
        <g transform="translate(232,88)">
          <path d="M0 0h22l10 10v36H0z" fill="var(--surface)" stroke="var(--good)" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M22 0v10h10" fill="none" stroke="var(--good)" stroke-width="1.6"/>
          <path d="M8 28l5 5 10-11" fill="none" stroke="var(--good)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <!-- sunucu: üstü çizili, kesik bağlantı -->
        <path d="M268 100 C 300 80, 320 70, 340 66" fill="none" stroke="var(--ink-3)" stroke-width="1.6" stroke-dasharray="4 5" opacity=".7"/>
        <g transform="translate(332,26)">
          <rect x="0" y="0" width="72" height="22" rx="4" fill="var(--surface-2)" stroke="var(--rule)" stroke-width="1.4"/>
          <rect x="0" y="28" width="72" height="22" rx="4" fill="var(--surface-2)" stroke="var(--rule)" stroke-width="1.4"/>
          <circle cx="10" cy="11" r="2.2" fill="var(--ink-3)"/><circle cx="10" cy="39" r="2.2" fill="var(--ink-3)"/>
          <path d="M-6 -6L78 56M78 -6L-6 56" stroke="var(--bad)" stroke-width="3" stroke-linecap="round"/>
        </g>
        <text x="368" y="94" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--bad)">{{t.dgServer}}</text>
        <!-- alt not -->
        <text x="30" y="236" font-family="var(--mono)" font-size="10" fill="var(--ink-3)">{{t.dgNote}}</text>
      </svg>
    </figure>
  </section>

  <section>
    <div class="section-head">
      <h2>{{t.toolsH}}</h2>
      <span>{{t.toolsN}}</span>
    </div>
    <div class="tools">
{{toolCards}}
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2>{{t.whyH}}</h2>
    </div>
    <div class="compare">
      <div class="side">
        <h3><span class="pill them">{{t.pillThem}}</span></h3>
        <svg viewBox="0 0 400 96" role="img" aria-labelledby="c1">
          <title id="c1">{{t.c1Title}}</title>
          <g transform="translate(14,28)"><path d="M0 0h22l10 10v30H0z" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="1.5" stroke-linejoin="round"/><path d="M22 0v10h10" fill="none" stroke="var(--ink-2)" stroke-width="1.5"/></g>
          <text x="30" y="86" text-anchor="middle" font-family="var(--mono)" font-size="9.5" fill="var(--ink-3)">{{t.lblYou}}</text>
          <path d="M58 48h108" stroke="var(--ink-3)" stroke-width="1.6" stroke-dasharray="4 4"/>
          <path d="M160 43l6 5-6 5" fill="none" stroke="var(--ink-3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <g transform="translate(174,20)"><rect x="0" y="0" width="56" height="24" rx="4" fill="var(--surface-2)" stroke="var(--bad)" stroke-width="1.5"/><rect x="0" y="30" width="56" height="24" rx="4" fill="var(--surface-2)" stroke="var(--bad)" stroke-width="1.5"/><circle cx="9" cy="12" r="2" fill="var(--bad)"/><circle cx="9" cy="42" r="2" fill="var(--bad)"/></g>
          <text x="202" y="86" text-anchor="middle" font-family="var(--mono)" font-size="9.5" fill="var(--bad)">{{t.lblServer}}</text>
          <path d="M238 48h108" stroke="var(--ink-3)" stroke-width="1.6" stroke-dasharray="4 4"/>
          <path d="M340 43l6 5-6 5" fill="none" stroke="var(--ink-3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <g transform="translate(354,28)"><path d="M0 0h22l10 10v30H0z" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="1.5" stroke-linejoin="round"/><path d="M22 0v10h10" fill="none" stroke="var(--ink-2)" stroke-width="1.5"/></g>
          <text x="370" y="86" text-anchor="middle" font-family="var(--mono)" font-size="9.5" fill="var(--ink-3)">{{t.lblBack}}</text>
        </svg>
        <p>{{t.why1}}</p>
      </div>
      <div class="side here">
        <h3><span class="pill us">{{t.pillUs}}</span></h3>
        <svg viewBox="0 0 400 96" role="img" aria-labelledby="c2">
          <title id="c2">{{t.c2Title}}</title>
          <rect x="8" y="10" width="384" height="62" rx="10" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4"/>
          <text x="20" y="26" font-family="var(--mono)" font-size="9.5" fill="var(--accent)" letter-spacing=".06em">{{t.lblDevice}}</text>
          <g transform="translate(40,32)"><path d="M0 0h20l9 9v26H0z" fill="var(--surface)" stroke="var(--ink-2)" stroke-width="1.5" stroke-linejoin="round"/><path d="M20 0v9h9" fill="none" stroke="var(--ink-2)" stroke-width="1.5"/></g>
          <path d="M84 50h60" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M138 45l6 5-6 5" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <g transform="translate(160,32)"><rect x="0" y="0" width="52" height="36" rx="7" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><circle cx="26" cy="18" r="7" fill="none" stroke="var(--accent)" stroke-width="1.8"/><path d="M26 8v4M26 24v4M16 18h4M32 18h4" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/></g>
          <path d="M226 50h60" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M280 45l6 5-6 5" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <g transform="translate(302,32)"><path d="M0 0h20l9 9v26H0z" fill="var(--surface)" stroke="var(--good)" stroke-width="1.5" stroke-linejoin="round"/><path d="M20 0v9h9" fill="none" stroke="var(--good)" stroke-width="1.5"/><path d="M7 20l4 4 8-9" fill="none" stroke="var(--good)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
          <text x="200" y="88" text-anchor="middle" font-family="var(--mono)" font-size="9.5" fill="var(--ink-3)">{{t.lblNoNet}}</text>
        </svg>
        <p>{{t.why2}}</p>
      </div>
    </div>
  </section>

  <footer>
    <span>{{t.foot}}</span>
    <span><a href="https://github.com/BabaTavman/noupload" rel="noopener">{{t.src}}</a></span>
  </footer>
</div>

{{> scripts}}
</body>
</html>
