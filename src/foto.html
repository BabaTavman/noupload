<!doctype html>
<html lang="{{lang}}">
<head>
<meta name="robots" content="noindex"><!-- build:remove — bu satır yalnızca şablonda durur (src/ dizine eklenmesin); üretilen sayfaya girmez -->
{{> head}}
<style>
  /* Bu sayfaya özgü stil. Ortak kurallar (renkler, yazı tipleri, üst çubuk, düğmeler, kartlar, alt not) assets/site.css'te;
     bu blok ondan sonra geldiği için aynı seçicide buradaki geçerli olur. */
  .wrap{max-width:880px}
  /* dil bağlantısı eklenince üst çubuk tek satıra ancak daha geniş ekranda sığıyor ("/ foto", "/ pdf"ten bir harf uzun);
     kırıntı o genişliğe kadar gizli kalsın ki çubuk bir tek, bir iki satır olmasın */
  @media (max-width:500px){.brand small{display:none}}

  /* bırakma alanı */
  #drop{border:2px dashed var(--dash);border-radius:16px;padding:34px 18px;text-align:center;cursor:pointer;background:var(--surface)}
  #drop.over{border-color:var(--blue)}
  #drop strong{display:block;font-size:1.0625rem;font-weight:600;margin-bottom:4px}
  #drop span{color:var(--ink-3);font-size:.875rem}
  #file{display:none}

  /* --- ayarlar --- */
  .row{display:flex;flex-wrap:wrap;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px;flex:1 1 150px;min-width:0}
  label{font-size:.84375rem;color:var(--ink-2);font-weight:600}
  input[type=number], select{
    font:inherit; font-size:1rem; padding:10px 12px;
    border:1.5px solid var(--ink-3); border-radius:10px;
    background:var(--ground); color:var(--ink); width:100%;
  }
  input:focus-visible, select:focus-visible, #drop:focus-visible{
    outline:3px solid var(--blue); outline-offset:2px;
  }
  .hint{font-size:.8125rem;color:var(--ink-3)}

  /* --- sonuç --- */
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:520px){.compare{grid-template-columns:1fr}}
  .pane{display:flex;flex-direction:column;gap:8px;min-width:0}
  .pane h3{margin:0;font-family:var(--font);font-size:.78125rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
  .pane img{width:100%;height:auto;border-radius:10px;border:1.5px solid var(--rule);background:var(--ground)}
  .stat{font-family:var(--mono);font-size:.84375rem;color:var(--ink-2)}
  .stat b{color:var(--ink);font-size:1.0625rem}
  /* mesajlar: yeşil yalnızca "tamam" durumu için; uyarıda yazı koyu kalır, mercan yalnızca kenar çizgisi (küçük yazıda kontrastı yetmez) */
  .verdict{font-size:.90625rem;padding:10px 14px;border-radius:12px;border-left:4px solid var(--rule);background:var(--ground);color:var(--ink-2)}
  .verdict.ok{color:var(--green-text);border-left-color:var(--green)}
  .verdict.miss{color:var(--ink);border-left-color:var(--brand)}
</style>
</head>
<body>
<div class="wrap">

{{> bar-tool}}

  <header>
    <h1>{{t.title}}</h1>
    <p>{{t.sub}}</p>
  </header>

  <div id="drop" tabindex="0" role="button" aria-label="{{t.dropLabel}}">
    <strong>{{t.drop1}}</strong>
    <span>{{t.drop2}}</span>
    <input type="file" id="file" accept="image/*">
  </div>

  <div class="card" id="controls" hidden>
    <div class="row">
      <div class="field">
        <label for="maxW">{{t.maxW}}</label>
        <input type="number" id="maxW" value="600" min="20" max="10000">
      </div>
      <div class="field">
        <label for="maxH">{{t.maxH}}</label>
        <input type="number" id="maxH" value="800" min="20" max="10000">
      </div>
      <div class="field">
        <label for="target">{{t.target}}</label>
        <input type="number" id="target" value="150" min="5" max="20000">
      </div>
    </div>
    <p class="hint" style="margin:10px 0 14px">{{t.hint}}</p>
    <div class="row">
      <button id="go">{{t.go}}</button>
      <button id="reset" class="ghost">{{t.reset}}</button>
    </div>
  </div>

  <div class="card" id="result" hidden>
    <div class="compare">
      <div class="pane">
        <h3>{{t.before}}</h3>
        <img id="imgBefore" alt="{{t.altBefore}}">
        <div class="stat" id="statBefore"></div>
      </div>
      <div class="pane">
        <h3>{{t.after}}</h3>
        <img id="imgAfter" alt="{{t.altAfter}}">
        <div class="stat" id="statAfter"></div>
      </div>
    </div>
    <p class="verdict" id="verdict" style="margin:14px 0"></p>
    <button id="download">{{t.download}}</button>
  </div>

{{> note}}

{{> more}}

  <footer>{{t.foot}}</footer>
</div>

{{> scripts}}
<script>
/* =================================================================
   1) ELEMANLARI YAKALA
   Her HTML elemanına id üzerinden bir kez ulaşıp değişkende tutuyoruz.
   (el() kısayolu, fmt() ve STR metinleri assets/site.js ile sayfanın başındaki betikten gelir.)
================================================================== */
const drop = el("drop"), fileInput = el("file");
const controls = el("controls"), result = el("result");
const maxW = el("maxW"), maxH = el("maxH"), target = el("target");
const imgBefore = el("imgBefore"), imgAfter = el("imgAfter");
const statBefore = el("statBefore"), statAfter = el("statAfter");
const verdict = el("verdict");

let sourceFile = null;   // kullanıcının seçtiği orijinal dosya
let outputBlob = null;   // küçültülmüş sonuç
let outputName = "";

/* =================================================================
   2) YARDIMCILAR
================================================================== */
const kb = bytes => (bytes / 1024).toFixed(0);

function show(file){
  sourceFile = file;
  outputBlob = null;
  imgBefore.src = URL.createObjectURL(file);
  imgBefore.onload = () => {
    statBefore.innerHTML =
      `<b>${kb(file.size)} KB</b><br>${imgBefore.naturalWidth}×${imgBefore.naturalHeight} px`;
  };
  controls.hidden = false;
  result.hidden = true;
}

/* =================================================================
   3) DOSYA SEÇME — üç yol: tıklama, sürükleme, klavye
================================================================== */
drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); }
});
fileInput.addEventListener("change", () => {
  if (fileInput.files[0]) show(fileInput.files[0]);
});
["dragenter","dragover"].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); })
);
["dragleave","drop"].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); })
);
drop.addEventListener("drop", e => {
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith("image/")) show(f);
});

/* =================================================================
   4) ASIL İŞ — küçültme ve sıkıştırma

   Mantık iki adımda:
   a) Fotoğrafı verilen kutuya SIĞACAK şekilde yeniden çiz (oran korunur).
   b) JPEG kalitesini ikili arama ile bul: hedef KB'nin altına düşen
      EN YÜKSEK kaliteyi arıyoruz. 8 deneme yeterli.
================================================================== */
async function shrink(file, boxW, boxH, targetBytes){
  // EXIF dönüklüğünü tarayıcı düzeltsin diye imageOrientation veriyoruz
  const bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });

  // (a) ölçek: kutuya sığdır, ama büyütme (1'den büyük olmasın)
  const scale = Math.min(boxW / bitmap.width, boxH / bitmap.height, 1);
  const w = Math.max(1, Math.round(bitmap.width  * scale));
  const h = Math.max(1, Math.round(bitmap.height * scale));

  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  // JPEG'in şeffaflığı yok; altına beyaz bas ki PNG'ler siyah çıkmasın
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(bitmap, 0, 0, w, h);

  const toBlob = q => new Promise(res => canvas.toBlob(res, "image/jpeg", q));

  // (b) ikili arama
  let lo = 0.30, hi = 0.95, best = await toBlob(hi);
  if (best.size > targetBytes){
    for (let i = 0; i < 8; i++){
      const mid = (lo + hi) / 2;
      const blob = await toBlob(mid);
      if (blob.size <= targetBytes){ best = blob; lo = mid; }  // sığdı, kaliteyi artırmayı dene
      else { hi = mid; }                                        // sığmadı, kaliteyi düşür
    }
    // arama boyunca hiç sığmadıysa en düşük kaliteyi son şans olarak dene
    if (best.size > targetBytes){
      const last = await toBlob(0.30);
      if (last.size < best.size) best = last;
    }
  }
  return { blob: best, w, h };
}

/* =================================================================
   5) BUTONLAR
================================================================== */
el("go").addEventListener("click", async () => {
  if (!sourceFile) return;
  const btn = el("go");
  btn.disabled = true; btn.textContent = STR.working;

  try{
    const targetBytes = Number(target.value) * 1024;
    const out = await shrink(sourceFile, Number(maxW.value), Number(maxH.value), targetBytes);

    outputBlob = out.blob;
    outputName = sourceFile.name.replace(/\.[^.]+$/, "") + STR.suffix + ".jpg";

    imgAfter.src = URL.createObjectURL(out.blob);
    statAfter.innerHTML = `<b>${kb(out.blob.size)} KB</b><br>${out.w}×${out.h} px`;

    const saved = Math.round((1 - out.blob.size / sourceFile.size) * 100);
    if (out.blob.size <= targetBytes){
      verdict.className = "verdict ok";
      verdict.textContent = fmt("ok", { kb: kb(out.blob.size), saved });
    } else {
      verdict.className = "verdict miss";
      verdict.textContent = fmt("miss", { kb: kb(out.blob.size), target: target.value });
    }
    result.hidden = false;
  } catch(err){
    verdict.className = "verdict miss";
    verdict.textContent = STR.bad;
    result.hidden = false;
  } finally {
    btn.disabled = false; btn.textContent = STR.go;
  }
});

el("download").addEventListener("click", () => {
  if (!outputBlob) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(outputBlob);
  a.download = outputName;
  a.click();
  URL.revokeObjectURL(a.href);
});

el("reset").addEventListener("click", () => {
  sourceFile = null; outputBlob = null; fileInput.value = "";
  controls.hidden = true; result.hidden = true;
});
</script>
</body>
</html>
