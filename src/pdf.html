<!doctype html>
<html lang="{{lang}}">
<head>
<meta name="robots" content="noindex"><!-- build:remove — bu satır yalnızca şablonda durur (src/ dizine eklenmesin); üretilen sayfaya girmez -->
{{> head}}

<!-- pdf-lib: PDF'i oluşturup değiştiren kütüphane -->
<script src="{{root}}lib/pdf-lib.min.js"></script>
<!-- pdf.js: sayfaları küçük resim olarak çizmek için -->
<script src="{{root}}lib/pdf.min.js"></script>

<style>
  /* Bu sayfaya özgü stil. Ortak kurallar (renkler, yazı tipleri, üst çubuk, düğmeler, kartlar, alt not) assets/site.css'te;
     bu blok ondan sonra geldiği için aynı seçicide buradaki geçerli olur. */
  /* kırıntı ("/ pdf") çubuğun tek satıra sığdığı genişliğe (476px + masaüstündeki kaydırma çubuğu payı) kadar gizli: çubuk bir tek, bir iki satır olmasın */
  @media (max-width:495px){.brand small{display:none}}

  /* sekmeler: hap düğmeler; seçili olan aracın rengiyle (sarı) dolar */
  .tabs{display:flex;flex-wrap:wrap;gap:8px}
  .tab{padding:10px 20px;border-radius:999px;border:1.5px solid var(--rule);background:var(--surface);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:.875rem}
  .tab[aria-selected="true"]{background:var(--yellow);border-color:var(--ink);color:var(--on-yellow)}

  /* bırakma alanı */
  .drop{border:2px dashed var(--dash);border-radius:16px;padding:34px 18px;text-align:center;cursor:pointer;background:var(--surface)}
  .drop.over{border-color:var(--blue)}
  .drop strong{display:block;font-size:1.0625rem;font-weight:600;margin-bottom:4px}
  .drop span{color:var(--ink-3);font-size:.875rem}
  input[type=file]{display:none}

  /* dosya listesi (birleştirme) */
  ul.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  ul.files li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--ground);border:1.5px solid var(--rule);border-radius:12px;padding:10px 12px}
  ul.files .idx{font-family:var(--mono);font-size:.8125rem;color:var(--ink-3)}
  ul.files .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9375rem}
  ul.files .meta{font-family:var(--mono);font-size:.78125rem;color:var(--ink-3)}
  .mini{display:flex;gap:4px}
  .mini button{padding:6px 10px;font-size:.875rem;border-radius:10px;background:var(--surface);color:var(--ink-2);border-color:var(--rule)}

  /* sayfa ızgarası */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
  .pg{position:relative;border:2px solid var(--rule);border-radius:12px;padding:6px;background:var(--ground);cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center}
  .pg.sel{border-color:var(--blue);background:color-mix(in srgb, var(--blue) 9%, var(--surface))}
  .pg canvas{width:100%;height:auto;border-radius:6px;background:#fff;display:block}
  .pg .no{font-family:var(--mono);font-size:.78125rem;color:var(--ink-3)}
  .pg.sel .no{color:var(--ink);font-weight:600}
  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .spacer{flex:1}
  .count{font-family:var(--mono);font-size:.8125rem;color:var(--ink-3)}
  /* mesajlar: yeşil yalnızca "tamam" durumu için; uyarıda yazı koyu kalır, mercan yalnızca kenar çizgisi (küçük yazıda kontrastı yetmez) */
  .msg{font-size:.90625rem;padding:10px 14px;border-radius:12px;border-left:4px solid var(--rule);background:var(--ground);color:var(--ink-2)}
  .msg{margin-top:12px}
  .msg.ok{color:var(--green-text);border-left-color:var(--green)}
  .msg.err{color:var(--ink);border-left-color:var(--brand)}
  .drop:focus-visible,.pg:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  /* dokunmatikte sıra düğmeleri parmağa göre; dar ekranda düğmeler alt satıra iner ki dosya adına yer kalsın */
  @media (pointer:coarse){.mini button{min-width:40px;min-height:40px;padding:0}}
  @media (pointer:coarse) and (max-width:400px){
    ul.files li{grid-template-columns:auto 1fr}
    .mini{grid-column:1/-1;justify-content:flex-end}
  }
  /* Windows kontrast temasında dolgu renkleri silinir: seçili sekme ve seçili sayfa kalın kenarlıkla ayrılır (odak halkasına dokunmadan) */
  @media (forced-colors: active){
    .tab[aria-selected="true"]{border:4px solid Highlight;padding:7px 17px}
    .pg.sel{border:5px solid Highlight;padding:3px}
    .drop.over{border-color:Highlight}
  }
</style>
</head>
<body>
<div class="wrap">

{{> bar-tool}}

  <header>
    <h1>{{t.title}}</h1>
    <p>{{t.sub}}</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" id="tabMerge" role="tab" aria-selected="true">{{t.tabMerge}}</button>
    <button class="tab" id="tabPages" role="tab" aria-selected="false">{{t.tabPages}}</button>
  </div>

  <!-- ======================= BİRLEŞTİRME ======================= -->
  <section id="paneMerge">
    <div class="drop" id="dropM" tabindex="0" role="button">
      <strong>{{t.dropM1}}</strong>
      <span>{{t.dropM2}}</span>
      <input type="file" id="fileM" accept="application/pdf" multiple>
    </div>

    <div class="card" id="cardM" hidden style="margin-top:16px">
      <ul class="files" id="listM"></ul>
      <div class="actions" style="margin-top:14px">
        <button id="mergeGo">{{t.mergeGo}}</button>
        <button class="ghost" id="mergeAdd">{{t.add}}</button>
        <button class="ghost" id="mergeClear">{{t.clear}}</button>
        <span class="spacer"></span>
        <span class="count" id="countM"></span>
      </div>
      <p class="msg" id="msgM" hidden></p>
    </div>
  </section>

  <!-- ======================= SAYFA SEÇME ======================= -->
  <section id="panePages" hidden>
    <div class="drop" id="dropP" tabindex="0" role="button">
      <strong>{{t.dropP1}}</strong>
      <span>{{t.dropP2}}</span>
      <input type="file" id="fileP" accept="application/pdf">
    </div>

    <div class="card" id="cardP" hidden style="margin-top:16px">
      <div class="actions" style="margin-bottom:14px">
        <button class="ghost" id="selAll">{{t.selAll}}</button>
        <button class="ghost" id="selNone">{{t.selNone}}</button>
        <button class="ghost" id="selInv">{{t.selInv}}</button>
        <button class="ghost" id="rot">{{t.rot}}</button>
        <span class="spacer"></span>
        <span class="count" id="countP"></span>
      </div>
      <div class="grid" id="gridP"></div>
      <div class="actions" style="margin-top:16px">
        <button id="pagesGo">{{t.pagesGo}}</button>
        <button class="ghost" id="pagesClear">{{t.clear}}</button>
      </div>
      <p class="msg" id="msgP" hidden></p>
    </div>
  </section>

{{> note}}

{{> more}}

  <footer>{{t.foot}}</footer>
</div>

{{> scripts}}
<script>
/* ==================================================================
   1) ORTAK YARDIMCILAR
================================================================== */
const { PDFDocument, degrees } = PDFLib;
// pdf.js sayfaları ayrı bir iş parçacığında (worker) çizer. Worker dosyası normalde ilk PDF açılana kadar
// istenmez; "sayfayı açtıktan sonra bağlantıyı kes, araç çalışmaya devam eder" sözü tutulsun diye
// sayfa açılırken belleğe alınır.
// pdf.js'e yüklenemeyen bir worker verilirse bir daha toparlanamıyor (sayfa yenilenene kadar her PDF'e
// "bozuk" diyor). O yüzden worker hazır değilse pdf.js hiç çağrılmaz; hazır olunca yeniden denenir.
const WORKER_URL = "{{root}}lib/pdf.worker.min.js";
pdfjsLib.GlobalWorkerOptions.workerSrc = WORKER_URL;
const overHttp = location.protocol.startsWith("http");            // diskten (file://) açıldıysa fetch yasak: adres doğrudan kullanılır
let workerReady = null;
function loadWorker(){
  if (!overHttp) return Promise.resolve(true);
  return workerReady = workerReady || fetch(WORKER_URL)
    .then(r => r.ok ? r.blob() : Promise.reject())
    .then(blob => { pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob); return true; })
    .catch(() => { workerReady = null; return false; });            // bir sonraki denemede yeniden istenir
}
loadWorker();

function say(node, text, kind){
  node.textContent = text;
  node.className = "msg" + (kind ? " " + kind : "");
  node.hidden = false;
}

// Blob'u indir. Tarayıcıda geçici bir bağlantı oluşturup tıklıyoruz.
function download(bytes, name){
  const blob = new Blob([bytes], { type:"application/pdf" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

// Sürükle-bırak davranışını tek yerde kur
function wireDrop(dropEl, inputEl, onFiles){
  dropEl.addEventListener("click", () => inputEl.click());
  dropEl.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); inputEl.click(); }
  });
  inputEl.addEventListener("change", () => onFiles([...inputEl.files]));
  ["dragenter","dragover"].forEach(ev =>
    dropEl.addEventListener(ev, e => { e.preventDefault(); dropEl.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev =>
    dropEl.addEventListener(ev, e => { e.preventDefault(); dropEl.classList.remove("over"); }));
  dropEl.addEventListener("drop", e =>
    onFiles([...e.dataTransfer.files].filter(f => f.type === "application/pdf")));
}

/* ==================================================================
   2) SEKMELER
================================================================== */
function showTab(which){
  const merge = which === "merge";
  el("tabMerge").setAttribute("aria-selected", merge);
  el("tabPages").setAttribute("aria-selected", !merge);
  el("paneMerge").hidden = !merge;
  el("panePages").hidden = merge;
}
el("tabMerge").addEventListener("click", () => showTab("merge"));
el("tabPages").addEventListener("click", () => showTab("pages"));

/* ==================================================================
   3) BİRLEŞTİRME
   mergeFiles: kullanıcının seçtiği dosyalar, sırası önemli.
================================================================== */
let mergeFiles = [];

function renderMergeList(){
  const list = el("listM");
  list.innerHTML = "";
  mergeFiles.forEach((f, i) => {
    const li = document.createElement("li");
    li.innerHTML = `
      <span class="idx">${String(i+1).padStart(2,"0")}</span>
      <span class="nm">${esc(f.name)}<br><span class="meta">${(f.size/1024).toFixed(0)} KB</span></span>
      <span class="mini">
        <button data-up="${i}" ${i===0?"disabled":""} aria-label="${STR.up}">↑</button>
        <button data-down="${i}" ${i===mergeFiles.length-1?"disabled":""} aria-label="${STR.down}">↓</button>
        <button data-del="${i}" aria-label="${STR.del}">✕</button>
      </span>`;
    list.appendChild(li);
  });
  el("countM").textContent = mergeFiles.length ? fmt("nFiles", { n: mergeFiles.length }) : "";
  el("cardM").hidden = mergeFiles.length === 0;
}

el("listM").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const swap = (a, c) => { [mergeFiles[a], mergeFiles[c]] = [mergeFiles[c], mergeFiles[a]]; };
  if (b.dataset.up   !== undefined) swap(+b.dataset.up, +b.dataset.up - 1);
  if (b.dataset.down !== undefined) swap(+b.dataset.down, +b.dataset.down + 1);
  if (b.dataset.del  !== undefined) mergeFiles.splice(+b.dataset.del, 1);
  renderMergeList();
});

wireDrop(el("dropM"), el("fileM"), files => {
  mergeFiles = mergeFiles.concat(files);
  el("msgM").hidden = true;
  renderMergeList();
});
el("mergeAdd").addEventListener("click", () => el("fileM").click());
el("mergeClear").addEventListener("click", () => {
  mergeFiles = []; el("fileM").value = ""; el("msgM").hidden = true; renderMergeList();
});

el("mergeGo").addEventListener("click", async () => {
  if (mergeFiles.length < 2) return say(el("msgM"), STR.needTwo, "err");
  const btn = el("mergeGo"); btn.disabled = true;
  say(el("msgM"), STR.working);
  try{
    // Boş bir PDF aç, her dosyanın tüm sayfalarını sırayla kopyala
    const out = await PDFDocument.create();
    for (const f of mergeFiles){
      const src = await PDFDocument.load(await f.arrayBuffer());
      const pages = await out.copyPages(src, src.getPageIndices());
      pages.forEach(p => out.addPage(p));
    }
    download(await out.save(), STR.mergedName);
    say(el("msgM"), fmt("merged", { n: mergeFiles.length }), "ok");
  } catch(err){
    say(el("msgM"), STR.bad, "err");
  } finally { btn.disabled = false; }
});

/* ==================================================================
   4) SAYFA SEÇME
   pageState: her sayfa için {selected, rotate}
================================================================== */
let pdfBytes = null;      // orijinal dosya baytları
let pageState = [];

function updatePageCount(){
  if (!pageState.length) { el("countP").textContent = ""; return; }
  const sel = pageState.filter(p => p.selected).length;
  el("countP").textContent = fmt("nPages", { sel, total: pageState.length, n: pageState.length });
}

async function loadForPages(file){
  el("msgP").hidden = true;
  if (!(await loadWorker())){                                       // bağlantı yokken ve worker daha alınmamışken
    el("cardP").hidden = false;
    el("fileP").value = "";                                         // aynı dosya yeniden seçilebilsin (yoksa "change" olayı doğmaz)
    return say(el("msgP"), STR.noWorker, "err");
  }
  try{
    pdfBytes = new Uint8Array(await file.arrayBuffer());

    // pdf.js dosyayı tüketebildiği için kopya veriyoruz
    const doc = await pdfjsLib.getDocument({ data: pdfBytes.slice() }).promise;
    pageState = Array.from({length: doc.numPages}, () => ({ selected:true, rotate:0 }));

    const grid = el("gridP");
    grid.innerHTML = "";
    el("cardP").hidden = false;

    for (let i = 1; i <= doc.numPages; i++){
      const page = await doc.getPage(i);
      const base = page.getViewport({ scale:1 });
      const viewport = page.getViewport({ scale: 130 / base.width });

      const canvas = document.createElement("canvas");
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;

      const cell = document.createElement("div");
      cell.className = "pg sel";
      cell.tabIndex = 0;
      cell.dataset.i = i - 1;
      cell.append(canvas);
      const no = document.createElement("span");
      no.className = "no"; no.textContent = i;
      cell.append(no);
      grid.append(cell);
    }
    updatePageCount();
  } catch(err){
    el("cardP").hidden = false;                                       // mesaj kartın içinde: ilk seçilen dosya bozuksa kart gizli kalıyor, hata hiç görünmüyordu
    say(el("msgP"), STR.bad, "err");
  }
}

wireDrop(el("dropP"), el("fileP"), files => { if (files[0]) loadForPages(files[0]); });

// Sayfaya tıklayınca seçimi değiştir
el("gridP").addEventListener("click", e => {
  const cell = e.target.closest(".pg"); if (!cell) return;
  const i = +cell.dataset.i;
  pageState[i].selected = !pageState[i].selected;
  cell.classList.toggle("sel", pageState[i].selected);
  updatePageCount();
});

function setAll(fn){
  pageState.forEach((p, i) => {
    p.selected = fn(p.selected);
    el("gridP").children[i].classList.toggle("sel", p.selected);
  });
  updatePageCount();
}
el("selAll").addEventListener("click",  () => setAll(() => true));
el("selNone").addEventListener("click", () => setAll(() => false));
el("selInv").addEventListener("click",  () => setAll(v => !v));

// Seçili sayfaları 90° döndür (görsel önizleme değişmiyor, çıktı değişiyor)
el("rot").addEventListener("click", () => {
  pageState.forEach((p, i) => {
    if (p.selected){
      p.rotate = (p.rotate + 90) % 360;
      el("gridP").children[i].querySelector("canvas").style.transform =
        `rotate(${p.rotate}deg) scale(${p.rotate % 180 ? .7 : 1})`;
    }
  });
});

el("pagesGo").addEventListener("click", async () => {
  const keep = pageState.map((p,i) => p.selected ? i : -1).filter(i => i >= 0);
  if (!keep.length) return say(el("msgP"), STR.pickOne, "err");
  const btn = el("pagesGo"); btn.disabled = true;
  say(el("msgP"), STR.working);
  try{
    const src = await PDFDocument.load(pdfBytes);
    const out = await PDFDocument.create();
    const copied = await out.copyPages(src, keep);
    copied.forEach((page, k) => {
      const extra = pageState[keep[k]].rotate;
      if (extra) page.setRotation(degrees((page.getRotation().angle + extra) % 360));
      out.addPage(page);
    });
    download(await out.save(), STR.pagesName);
    say(el("msgP"), fmt("made", { n: keep.length }), "ok");
  } catch(err){
    say(el("msgP"), STR.bad, "err");
  } finally { btn.disabled = false; }
});

el("pagesClear").addEventListener("click", () => {
  pdfBytes = null; pageState = []; el("fileP").value = "";
  el("gridP").innerHTML = ""; el("cardP").hidden = true; el("msgP").hidden = true;
  updatePageCount();
});

renderMergeList();
updatePageCount();
</script>
</body>
</html>
